{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Dhruba's Blog{% endblock %}</title>
  
  <!-- Global App Styles -->
  <link rel="stylesheet" href="{% static 'blog/app.css' %}">
  
  <!-- Page-specific CSS Files -->
  {% block css_files %}{% endblock %}
</head>
<body class="site-body">
  <header id="main-navigation">
    <nav class="nav-bar">
      <div class="nav-container">
        <a href="{% url 'starting-page' %}" class="nav-brand">
          <span>Dhruba's Blog</span>
        </a>
        <div class="nav-actions">
          <a href="{% url 'posts-page' %}" class="nav-link">
            All posts
          </a>
        </div>
      </div>
    </nav>
  </header>

  <main class="main-content">
    {% block content %}
    {% endblock %}
  </main>

  <footer id="main-footer">
    <p>&copy; 2026 Dhruba's Blog. Built with Django.</p>
  </footer>
</body>
</html>
